<?xml version="1.0" encoding="UTF-8"?>
<!-- A small multi-region drawing: five named <g id> regions, each a solid
     colour, tiling a flush "0 0 W H" viewBox with no overlap (so each region
     owns its area and keeps its colour). "sky" is cut around the roof, and
     "house" around the door, for that reason: where two regions overlapped,
     the colour of the overlap would come down to import order. The @svg wizard
     reads the region colours out into panel.scad's svg_layers, and each region
     imports and colours separately. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120mm" height="90mm">
  <g id="sky" fill="#87ceeb">
    <path d="M0 0H120V45H82L60 26 38 45H0Z"/>
  </g>
  <g id="ground" fill="#9acd32">
    <rect x="0" y="45" width="44" height="45"/>
    <rect x="76" y="45" width="44" height="45"/>
  </g>
  <g id="roof" fill="#a34343">
    <path d="M38 45 60 26 82 45Z"/>
  </g>
  <g id="house" fill="#cd5c5c">
    <path d="M44 45H76V90H66V66H54V90H44Z"/>
  </g>
  <g id="door" fill="#7d3232">
    <rect x="54" y="66" width="12" height="24"/>
  </g>
</svg>
