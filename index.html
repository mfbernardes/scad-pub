<!doctype html>
<!-- lang/dir are injected from the active config at build time (configHtml in
     vite.config.ts); they default to en/ltr. -->
<html lang="%APP_LANG%" dir="%APP_DIR%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <!-- theme-color, title and description are injected from the active config at
         build time (see the configHtml plugin in vite.config.ts). -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="%APP_THEME_COLOR_DARK%" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="%APP_THEME_COLOR_LIGHT%" />
    <!-- Apple PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_APPLE_TITLE%" />
    <!-- Apply the saved/auto theme before first paint to avoid a flash. The
         storage key is namespaced per config (injected by the configHtml Vite
         plugin) so it matches src/lib/theme.ts's ns("theme"). Also sets
         <html lang> from a persisted locale choice (ns("lang") in
         src/lib/localeStore.ts) before first paint, same reasoning: without
         this a returning visitor who switched locale sees the deployment's
         default `lang` flash before React mounts and localeStore's own
         (async) resolution corrects it. lang only, no dir: every shipped
         locale is ltr today (see src/lib/localeRegistry.ts's own note). A
         missing/invalid key is a no-op — the server-rendered %APP_LANG%
         default stands. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("%APP_THEME_KEY%") || "auto";
          var dark =
            m === "dark" ||
            (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
        try {
          var lang = localStorage.getItem("%APP_LANG_KEY%");
          if (lang) document.documentElement.lang = lang;
        } catch (e) {
          /* no persisted locale, or storage unavailable: keep the default lang */
        }
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <!-- iOS standalone launch images (generated per device by gen-schema). -->
    %APP_APPLE_SPLASH%
    <title>%APP_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
